[project]
name = "blockwright-ai-worker"
version = "0.1.0"
description = "Blockwright AI/geometry worker: optional Sking/TripoSR adapters and mesh-to-cuboid conversion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.156.4",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "trimesh>=5.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
]
